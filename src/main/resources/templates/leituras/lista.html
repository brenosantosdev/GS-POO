<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leituras</title>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<h1>Leituras</h1>
<p th:if="${mensagem}" th:text="${mensagem}" style="color:green"></p>
<p th:if="${erro}" th:text="${erro}" style="color:red"></p>
<p><a th:href="@{/leituras/novo}">Nova leitura</a></p>
<table border="1" cellpadding="6">
    <tr>
        <th>Data e hora</th>
        <th>Logradouro</th>
        <th>Lâmina (cm)</th>
        <th>Status</th>
        <th>Ações</th>
    </tr>
    <tr th:each="l : ${leituras}">
        <td th:text="${#temporals.format(l.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${l.trechoDescricao}"></td>
        <td th:text="${l.laminaCm}"></td>
        <td th:text="${l.status}"></td>
        <td>
            <a th:href="@{/leituras/{id}/editar(id=${l.id})}">Editar</a>
            <form th:action="@{/leituras/{id}/excluir(id=${l.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('Excluir?')">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
