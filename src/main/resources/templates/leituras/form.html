<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Leitura</title>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<h1>Leitura</h1>
<form th:action="@{/leituras/salvar}" th:object="${leitura}" method="post">
    <input type="hidden" th:field="*{id}">
    <p>
        <label>Trecho:
            <select th:field="*{trechoId}">
                <option value="">Selecione...</option>
                <option th:each="t : ${trechos}" th:value="${t.id}"
                        th:text="${t.logradouro + ' (' + t.bairroNome + ')'}"></option>
            </select>
        </label>
        <span th:if="${#fields.hasErrors('trechoId')}" th:errors="*{trechoId}" style="color:red"></span>
    </p>
    <p>
        <label>Data e hora: <input type="datetime-local" th:field="*{dataHora}"></label>
        <span th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}" style="color:red"></span>
    </p>
    <p>
        <label>Lâmina (cm): <input type="number" th:field="*{laminaCm}"></label>
        <span th:if="${#fields.hasErrors('laminaCm')}" th:errors="*{laminaCm}" style="color:red"></span>
    </p>
    <button type="submit">Salvar</button>
    <a th:href="@{/leituras}">Cancelar</a>
</form>
</body>
</html>
