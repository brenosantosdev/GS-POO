<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel do bairro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<h1 th:text="'Painel · ' + ${painel.bairroNome}"></h1>

<div class="cards">
    <div class="card normal"><strong th:text="${painel.qtdNormal}"></strong><small>Normal</small></div>
    <div class="card atencao"><strong th:text="${painel.qtdAtencao}"></strong><small>Atenção</small></div>
    <div class="card alerta"><strong th:text="${painel.qtdAlerta}"></strong><small>Alerta</small></div>
</div>

<table>
    <tr>
        <th>Trecho</th>
        <th>Tipo de calçada</th>
        <th>Altitude (m)</th>
        <th>Última lâmina (cm)</th>
        <th>Status</th>
    </tr>
    <tr th:each="i : ${painel.itens}">
        <td th:text="${i.logradouro}"></td>
        <td th:text="${i.tipoCalcada}"></td>
        <td th:text="${i.altitude}"></td>
        <td th:text="${i.ultimaLamina} ?: '-'"></td>
        <td>
            <span class="badge" th:if="${i.ultimoStatus}" th:classappend="${i.ultimoStatus}" th:text="${i.ultimoStatus}"></span>
            <span th:unless="${i.ultimoStatus}">-</span>
        </td>
    </tr>
</table>
<p><a th:href="@{/bairros}">Voltar</a></p>
</body>
</html>
