<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/estilo.css}">
<head>
    <meta charset="UTF-8">
    <title>Bairros</title>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<h1>Bairros</h1>
<p th:if="${mensagem}" th:text="${mensagem}" style="color:green"></p>
<p th:if="${erro}" th:text="${erro}" style="color:red"></p>
<p><a th:href="@{/bairros/novo}">Novo bairro</a></p>
<table border="1" cellpadding="6">
    <tr>
        <th>Nome</th>
        <th>Zona</th>
        <th>Possui piscinão</th>
        <th>Ações</th>
    </tr>
    <tr th:each="b : ${bairros}">
        <td th:text="${b.nome}"></td>
        <td th:text="${b.zona}"></td>
        <td th:text="${b.possuiPiscinao} ? 'Sim' : 'Não'"></td>
        <td>
            <a th:href="@{/bairros/{id}/editar(id=${b.id})}">Editar</a>
            <a th:href="@{/bairros/{id}/painel(id=${b.id})}">Painel</a>
            <form th:action="@{/bairros/{id}/excluir(id=${b.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('Excluir?')">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
