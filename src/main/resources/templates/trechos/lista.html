<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trechos</title>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<h1>Trechos</h1>
<p th:if="${mensagem}" th:text="${mensagem}" style="color:green"></p>
<p th:if="${erro}" th:text="${erro}" style="color:red"></p>
<p><a th:href="@{/trechos/novo}">Novo trecho</a></p>
<table border="1" cellpadding="6">
    <tr>
        <th>Logradouro</th>
        <th>Bairro</th>
        <th>Tipo de calçada</th>
        <th>Altitude (m)</th>
        <th>Ações</th>
    </tr>
    <tr th:each="t : ${trechos}">
        <td th:text="${t.logradouro}"></td>
        <td th:text="${t.bairroNome}"></td>
        <td th:text="${t.tipoCalcada}"></td>
        <td th:text="${t.altitude}"></td>
        <td>
            <a th:href="@{/trechos/{id}/editar(id=${t.id})}">Editar</a>
            <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post"
                  style="display:inline" onsubmit="return confirm('Excluir?')">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
